# Cost / token budget manager settings.
budgets:
  project:
    max-tokens: 2000000
  task:
    default-max-tokens: 200000
  bug-loop:
    # Max QA -> Team Lead -> Developer round trips before escalating (prevents infinite loops).
    max-retries: 3
  # On breach the engine halts cleanly BETWEEN tasks — a running task, including its rework/build-fix
  # loops, always finishes first — and reports the project BLOCKED with the cost. This is a circuit
  # breaker against runaway cost, NOT a per-call quality limit, so size project.max-tokens as a
  # ceiling comfortably above a normal run.
  on-breach: HALT
