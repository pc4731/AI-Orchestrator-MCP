# Cost / token budget manager settings.
budgets:
  project:
    max-tokens: 2000000
  task:
    default-max-tokens: 200000
  bug-loop:
    # Max QA -> Team Lead -> Developer round trips before escalating (prevents infinite loops).
    max-retries: 3
  # What to do when a budget is breached: ESCALATE to the Team Lead, or HALT the project.
  on-breach: ESCALATE
