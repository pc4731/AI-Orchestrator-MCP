# Per-agent configuration. Model assignment is configurable here and NEVER hardcoded.
# `model` accepts a literal model id or one of the aliases defined in llm.yml (opus/sonnet/haiku).
agents:
  definitions:
    business-analyst:
      role: BUSINESS_ANALYST
      model: opus
      prompt-file: prompts/business-analyst.md
      capabilities: [ELICIT_REQUIREMENTS, CLARIFY_REQUIREMENTS]
      max-output-tokens: 4096
      temperature: 0.3

    market-researcher:
      role: MARKET_RESEARCHER
      model: opus
      prompt-file: prompts/market-researcher.md
      capabilities: [MARKET_RESEARCH]
      max-output-tokens: 4096
      temperature: 0.4

    prompt-engineer:
      role: PROMPT_ENGINEER
      model: sonnet
      prompt-file: prompts/prompt-engineer.md
      capabilities: [REFINE_PROMPT]
      max-output-tokens: 2048
      temperature: 0.1

    team-lead:
      role: TEAM_LEAD
      model: opus
      prompt-file: prompts/team-lead.md
      capabilities: [DECOMPOSE_TASKS]
      max-output-tokens: 4096
      temperature: 0.2

    backend-architect:
      role: BACKEND_ARCHITECT
      model: opus
      prompt-file: prompts/backend-architect.md
      capabilities: [DESIGN_ARCHITECTURE]
      max-output-tokens: 8192
      temperature: 0.2

    frontend-architect:
      role: FRONTEND_ARCHITECT
      model: opus
      prompt-file: prompts/frontend-architect.md
      capabilities: [DESIGN_ARCHITECTURE]
      max-output-tokens: 8192
      temperature: 0.2

    ai-ml-architect:
      role: AI_ML_ARCHITECT
      model: opus
      prompt-file: prompts/ai-ml-architect.md
      capabilities: [DESIGN_ARCHITECTURE]
      max-output-tokens: 8192
      temperature: 0.2

    ui-designer:
      role: UI_DESIGNER
      model: sonnet
      prompt-file: prompts/ui-designer.md
      capabilities: [DESIGN_UI]
      max-output-tokens: 4096
      temperature: 0.4
      skills: [accessibility, modern-ui]   # pluggable skills appended to this agent's prompt

    backend-developer:
      role: BACKEND_DEVELOPER
      model: sonnet            # Opus/Sonnet configurable — switch here per cost/quality needs.
      prompt-file: prompts/backend-developer.md
      capabilities: [WRITE_CODE, EXECUTE_TOOLS]
      max-output-tokens: 8192
      temperature: 0.1

    frontend-developer:
      role: FRONTEND_DEVELOPER
      model: sonnet
      prompt-file: prompts/frontend-developer.md
      skills: [accessibility, modern-ui]
      capabilities: [WRITE_CODE, EXECUTE_TOOLS]
      max-output-tokens: 8192
      temperature: 0.1

    ai-ml-developer:
      role: AI_ML_DEVELOPER
      model: sonnet
      prompt-file: prompts/ai-ml-developer.md
      capabilities: [WRITE_CODE, EXECUTE_TOOLS]
      max-output-tokens: 8192
      temperature: 0.1

    qa-engineer:
      role: QA_ENGINEER
      model: sonnet
      prompt-file: prompts/qa-engineer.md
      capabilities: [RUN_TESTS, REVIEW_CODE, EXECUTE_TOOLS]
      max-output-tokens: 4096
      temperature: 0.2

    dba:
      role: DBA
      model: opus
      prompt-file: prompts/dba.md
      capabilities: [DESIGN_SCHEMA]
      max-output-tokens: 4096
      temperature: 0.2

    security-reviewer:
      role: SECURITY_REVIEWER
      model: opus
      prompt-file: prompts/security-reviewer.md
      capabilities: [SECURITY_AUDIT, REVIEW_CODE]
      max-output-tokens: 4096
      temperature: 0.1

    code-reviewer:
      role: CODE_REVIEWER
      model: opus
      prompt-file: prompts/code-reviewer.md
      capabilities: [REVIEW_CODE]
      max-output-tokens: 4096
      temperature: 0.1

    content-writer:
      role: CONTENT_WRITER
      model: sonnet
      prompt-file: prompts/content-writer.md
      capabilities: [WRITE_CONTENT]
      skills: [accessibility]
      max-output-tokens: 4096
      temperature: 0.5

    seo-expert:
      role: SEO_EXPERT
      model: sonnet
      prompt-file: prompts/seo-expert.md
      capabilities: [OPTIMIZE_SEO]
      skills: [accessibility]
      max-output-tokens: 4096
      temperature: 0.3

    devops-engineer:
      role: DEVOPS_ENGINEER
      model: sonnet
      prompt-file: prompts/devops-engineer.md
      capabilities: [AUTOMATE_DEPLOYMENT, WRITE_CODE]
      max-output-tokens: 4096
      temperature: 0.2

    knowledge-curator:
      role: KNOWLEDGE_CURATOR
      model: sonnet
      prompt-file: prompts/knowledge-curator.md
      capabilities: [CURATE_KNOWLEDGE]
      # Keep the brief tight — it is re-sent as planning context on every future session.
      max-output-tokens: 2048
      temperature: 0.2

    project-explainer:
      role: PROJECT_EXPLAINER
      model: opus
      prompt-file: prompts/project-explainer.md
      capabilities: [EXPLAIN_PROJECT]
      max-output-tokens: 4096
      temperature: 0.2
