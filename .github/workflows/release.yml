name: Release

# Publishes a prebuilt MCP-server jar so friends can install without building locally.
# Trigger by pushing a version tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the Release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: ./gradlew test bootJar --console=plain

      - name: Create release with the jar
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/agent-orchestration-*.jar
          generate_release_notes: true
          body: |
            Prebuilt MCP server jar. Friends can install without a local build:

            ```bash
            git clone <this-repo-url> agent-orchestration
            cd agent-orchestration
            ./install.sh            # downloads this jar; no Gradle build needed
            ```

            Running it still needs a Java 21 runtime (JRE) and Claude Code on PATH.
